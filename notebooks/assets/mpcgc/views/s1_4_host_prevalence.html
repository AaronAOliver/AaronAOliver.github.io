<script>(function(){
  var tip = document.getElementById('tip');
  function show(e){
    var g = e.target.closest('rect.bar');
    if (!g) return;
    var d = g.dataset;
    tip.innerHTML =
      '<div class="g">' + d.group + '</div>' +
      '<table>' +
      '<tr><td class="k">Prevalence</td><td class="v">' + d.prevalence +
        '%  (' + d.nhosts + ' / ' + d.ntotal + ' genomes)</td></tr>' +
      '<tr><td class="k">Multi-copy hosts</td><td class="v">' +
        d.nmulti + ' genomes (' + d.pctmulti + '% of hosts)</td></tr>' +
      '<tr><td class="k">Mean copies / host</td><td class="v">' +
        d.meancp + '</td></tr>' +
      '<tr><td class="k">Max copies in one genome</td><td class="v">' +
        d.maxcp + '</td></tr>' +
      '</table>';
    tip.style.display = 'block';
    move(e);
  }
  function move(e){
    var pad = 14;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 8)  x = e.clientX - pad - w;
    if (y + h > window.innerHeight - 8) y = e.clientY - pad - h;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hide(){ tip.style.display = 'none'; }
  document.querySelectorAll('rect.bar').forEach(function(b){
    b.addEventListener('mouseenter', show);
    b.addEventListener('mousemove',  move);
    b.addEventListener('mouseleave', hide);
  });
})();</script>
