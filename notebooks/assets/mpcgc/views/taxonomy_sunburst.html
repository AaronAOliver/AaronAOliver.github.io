<script>
(function(){
  const div = document.getElementById('home_sunburst');
  if (!div || !div.on) return;
  // Single click  -> Plotly's native sunburst drill (we don't suppress it).
  // Double click  -> navigate the parent window to the slice's page.
  // We detect double-click manually: two plotly_click events on the SAME
  // point within DBL_MS milliseconds.
  const DBL_MS = 350;
  let last = { id: null, t: 0 };
  div.on('plotly_click', function(data){
    if (!data || !data.points || !data.points.length) return;
    const pt = data.points[0];
    const now = Date.now();
    if (last.id === pt.id && (now - last.t) < DBL_MS) {
      const url = pt.customdata;
      if (url && typeof url === 'string' && url.length) {
        try { window.parent.location.href = url; }
        catch(e) { window.location.href = url; }
      }
      last = { id: null, t: 0 };
    } else {
      last = { id: pt.id, t: now };
    }
  });
})();
</script><script src="../assets/plot-theme.js?v=20261005b"></script>
