  const LEGEND = [{"label":"cello/xylobiases","color":"#88CCEE","count":1},{"label":"pectinases","color":"#FFAABB","count":1},{"label":"carrageenases/agarases","color":"#EE3377","count":3},{"label":"sulfatases","color":"#F7E11C","count":16},{"label":"other CAZymes","color":"#000000","count":9},{"label":"auxiliary","color":"#911eb4","count":23}];
  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements: ELEMENTS,
    layout: { name: 'preset' },
    wheelSensitivity: 0.2, minZoom: 0.1, maxZoom: 6,
    style: [
      { selector: 'node', style: {
          'shape':'round-rectangle',
          'width':'data(size)','height':'data(size)',
          'background-color':'data(color)',
          'border-width':2,'border-color':'#222',
          'label':'data(display_label)',
          'font-size':'data(font_size)',
          'color':'data(text_color)',
          'text-halign':'center','text-valign':'center',
          'font-weight':600,
      } },
      { selector: 'node[is_auxiliary = "true"]',
         style: { 'border-width': 0.5 } },
      { selector: 'node:selected',
         style: { 'border-color':'#e6194b', 'border-width':3 } },
      { selector: 'edge', style: {
          'curve-style':'straight',

          'line-color':'#6b6b6b','opacity':0.7,

  cy.fit(null, 60);
  const infoPanel=document.getElementById('info');
  const infoTitle=document.getElementById('info-title');

  cy.on('mouseover','node',evt=>{
    const n=evt.target;
    infoTitle.textContent=n.data('label');
    infoContent.innerHTML='<div class="row"><span class="k">Proteins:</span> '+n.data('count')+'</div>'+
      '<div class="row"><span class="k">Degree:</span> '+n.degree(false)+'</div>';
    infoPanel.style.display='block';
  });
  cy.on('mouseover','edge',evt=>{
    const e=evt.target;
    const src=cy.getElementById(e.data('source')).data('label');
    const tgt=cy.getElementById(e.data('target')).data('label');
    const c=e.data('contributors')||[];
    infoTitle.textContent=src+' <-> '+tgt;
    infoContent.innerHTML='<div class="row"><span class="k">Weight:</span> '+e.data('weight')+'</div>'+
      '<div class="row"><span class="k">Genomes ('+c.length+'):</span><br>'+c.slice(0,10).join(', ')+
      (c.length>10?' (+'+(c.length-10)+' more)':'')+'</div>';
    infoPanel.style.display='block';
  });
  cy.on('mouseout','node, edge',()=>{infoPanel.style.display='none';});
  const ld=document.getElementById('legend-items');
  LEGEND.forEach(entry=>{

    };
    ld.appendChild(it);
  });
